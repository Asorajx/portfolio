<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jun Xiang — Portfolio</title>
  <desc id="desc">Dark apothecary-inspired personal portfolio preview with a plum Chinese-character seal and a gold, jade, and sage alchemical circle.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19211d"/>
      <stop offset=".58" stop-color="#1d2922"/>
      <stop offset="1" stop-color="#141c18"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="52%" r="48%">
      <stop offset="0" stop-color="#536f52" stop-opacity=".18"/>
      <stop offset=".8" stop-color="#536f52" stop-opacity=".035"/>
      <stop offset="1" stop-color="#536f52" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft color glows add depth without competing with the main heading. -->
    <radialGradient id="jadeHaze" cx="76%" cy="57%" r="53%">
      <stop offset="0" stop-color="#4f8c82" stop-opacity=".145"/>
      <stop offset=".6" stop-color="#4f8c82" stop-opacity=".034"/>
      <stop offset="1" stop-color="#4f8c82" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plumHaze" cx="92%" cy="86%" r="39%">
      <stop offset="0" stop-color="#c07c8f" stop-opacity=".095"/>
      <stop offset="1" stop-color="#c07c8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plumSeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5267"/>
      <stop offset=".55" stop-color="#754354"/>
      <stop offset="1" stop-color="#593543"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r=".6" fill="#9f997e" opacity=".15"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#jadeHaze)"/>
  <rect width="1200" height="630" fill="url(#plumHaze)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="46" y="46" width="1108" height="538" rx="5" fill="none" stroke="#63705e" stroke-width="1.3" opacity=".73"/>
  <!-- Little plum and jade edge marks echo apothecary notebook details. -->
  <path d="M46 180v42 M46 226v8" fill="none" stroke="#c07c8f" stroke-width="1.6" opacity=".45"/>
  <path d="M1154 358v39 M1154 402v7" fill="none" stroke="#4f8c82" stroke-width="1.6" opacity=".6"/>
  <path d="M62 62h22M62 62v22 M1138 62h-22M1138 62v22 M62 568h22M62 568v-22 M1138 568h-22M1138 568v-22"
        fill="none" stroke="#b19a70" stroke-width="1.8" opacity=".68"/>

  <!-- Plum-tinted Chinese-character seal matches the website's original branding. -->
  <rect x="96" y="94" width="63" height="63" rx="2" fill="url(#plumSeal)" stroke="#c7a869" stroke-opacity=".92" stroke-width="1.5"/>
  <rect x="100" y="98" width="55" height="55" rx="1" fill="none" stroke="#d59aae" stroke-opacity=".38" stroke-width=".8"/>
  <text x="127.5" y="139" text-anchor="middle" fill="#f5eddf" font-size="42" font-weight="500" font-family="Noto Sans CJK SC, sans-serif">俊</text>
  <text x="180" y="118" fill="#dedaca" font-size="18" font-weight="600" letter-spacing="4" font-family="Inter, sans-serif">JUN XIANG</text>
  <text x="180" y="147" fill="#a5b2a2" font-size="13" font-weight="500" letter-spacing="3.8" font-family="Inter, sans-serif">PERSONAL PORTFOLIO</text>
  <text x="1090" y="124" text-anchor="end" fill="#b8ac8e" font-size="14" font-weight="500" letter-spacing="2.5" font-family="Inter, sans-serif">PROJECTS · EXPERIMENTS · IDEAS</text>

  <!-- Main name and understated description read well at thumbnail size. -->
  <text x="93" y="355" fill="#eee9da" font-family="EB Garamond, Georgia, serif" font-size="146" font-weight="400" letter-spacing="-4">Jun Xiang</text>
  <line x1="101" y1="403" x2="615" y2="403" stroke="#bda476" stroke-width="1.5" opacity=".9"/>
  <line x1="101" y1="403" x2="147" y2="403" stroke="#c07c8f" stroke-width="2" opacity=".95"/>
  <text x="101" y="458" fill="#bfd0a6" font-family="Inter, sans-serif" font-size="25" font-weight="400" letter-spacing=".05">Things I'm building and learning along the way.</text>
  <path d="M101 483h50" stroke="#4f8c82" stroke-width="1.4" opacity=".82"/>
  <circle cx="160" cy="483" r="2" fill="#c07c8f" opacity=".82"/>

  <!-- Simplified version of the site's magic-circle motif. -->
  <g transform="translate(945 329)" fill="none" stroke="#b8a073" stroke-width="1.2" opacity=".87">
    <circle r="181" stroke-width="1.1" opacity=".64"/>
    <circle r="169" stroke="#4f8c82" stroke-width="1.7" opacity=".54"/>
    <circle r="145" stroke-dasharray="1.2 12" stroke-linecap="round" opacity=".56"/>
    <path d="M0 -154 L133 82 L-133 82 Z" stroke-width="1.8"/>
    <path d="M0 -94 L81 49 L-81 49 Z" opacity=".46"/>
    <circle cy="-4" r="65" stroke="#b8a073" opacity=".52"/>
    <circle cy="-4" r="47" stroke="#90aa7f" opacity=".82"/>
    <path d="M0 -51L41 20H-41Z" stroke="#bfd0a6" stroke-width="1.4"/>
    <path d="M0 -184v26 M0 158v26 M-184 0h26 M158 0h26" opacity=".72"/>
    <path d="M-132 -132l20 20M132 -132l-20 20M-132 132l20-20M132 132l-20-20" opacity=".38"/>
    <circle cy="-4" r="5.5" fill="#c7a869" stroke="none"/>
    <circle cy="-154" r="5" fill="#90aa7f" stroke="none"/>
    <circle cx="133" cy="82" r="5" fill="#c7a869" stroke="none"/>
    <circle cx="-133" cy="82" r="5" fill="#4f8c82" stroke="none"/>
  </g>
  <!-- Minimal glass flask, echoing the site's potions and alchemy illustrations. -->
  <g transform="translate(1082 544)" fill="none" stroke-linejoin="round">
    <path d="M-5 -15v-13h10v13l7 8v11c0 8-5 12-12 12S-12 12-12 4V-7z" stroke="#c7a869" stroke-width="1.25" opacity=".88"/>
    <path d="M-6 -27h12" stroke="#c7a869" stroke-width="1.5" opacity=".95"/>
    <path d="M-9 -1q9 -4 18 0v6q0 10 -9 10t-9 -10z" fill="#95556b" fill-opacity=".56" stroke="#c07c8f" stroke-width=".65" opacity=".96"/>
    <path d="M-8 -3q4 -3 7 -2" stroke="#bfd0a6" stroke-width="1" stroke-linecap="round" opacity=".65"/>
    <circle cx="-2" cy="4" r="1.8" fill="#bfd0a6" stroke="none"/>
    <circle cx="3" cy="9" r="1.5" fill="#d59aae" stroke="none"/>
  </g>
  <path d="M755 130l0 -7m0 14l0 7m-7 -7l-7 0m14 0l7 0 M1125 229v-5m0 10v5m-5 -10h-5m10 0h5" stroke="#c4a978" stroke-width="1" opacity=".55"/>
  <line x1="97" y1="539" x2="1103" y2="539" stroke="#647365" stroke-width="1" opacity=".65"/>
  <text x="100" y="563" fill="#b6b8aa" font-size="13" letter-spacing="2.25" font-family="Inter, sans-serif">A COLLECTION OF WORK AND SMALL EXPERIMENTS</text>

</svg>
