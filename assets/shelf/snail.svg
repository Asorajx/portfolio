<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 52">
  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 6s .8s infinite; }
    .stalks { transform-origin: 18px 26px; animation: wiggle 2.8s ease-in-out infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
