      <stop offset=".82" stop-color="#4c6a85"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2c2"/><stop offset=".6" stop-color="#f3e2c2"/>
      <stop offset=".6" stop-color="#dcc39a"/>
    </linearGradient>
  </defs>
  <ellipse cx="38" cy="49" rx="28" ry="2.6" fill="#1a110a" opacity=".3"/>
