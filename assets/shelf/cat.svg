  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s 1.2s infinite; }
    .tail { transform-origin: 44px 70px; animation: swish 2.4s ease-in-out infinite; }
    .bell { transform-box: fill-box; transform-origin: 50% 0; animation: jingle 4.6s ease-in-out infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes swish { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
    @keyframes jingle { 0%, 90%, 100% { transform: rotate(0); } 93% { transform: rotate(10deg); } 96% { transform: rotate(-8deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
