  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.5s 2.4s infinite; }
    .ear-right { transform-origin: 34px 26px; animation: twitch 4s ease-in-out infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes twitch { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(14deg); } 90% { transform: rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
